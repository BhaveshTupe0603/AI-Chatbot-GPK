<!DOCTYPE html>
<html>
<head>
  <title>SmartBot - ChatBot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 100%;
    }

#chat-header {
  background-color: #007bff;
  color: white;
  padding: 12px;
  font-size: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 999;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.menu-container {
  position: relative;
  display: inline-block;
}

.menu-btn {
  background: none;
  border: none;
  color: white;
  font-size: 24px;
  cursor: pointer;
}

.dropdown {
  display: none;
  position: absolute;
  right: 0;
  background-color: white;
  min-width: 160px;
  box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
  z-index: 1001;
  border-radius: 6px;
  overflow: hidden;
}

.dropdown a {
  color: black;
  padding: 10px 16px;
  text-decoration: none;
  display: block;
}

.dropdown a:hover {
  background-color: #f1f1f1;
}

    #user-controls {
      background: #f1f1f1;
      text-align: right;
      padding: 10px;
    }

    #user-controls button {
      background-color: #007bff;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      background-color: #e7f2ff;
    }

    .message {
      max-width: 80%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background-color: #dcf8c6;
      border-bottom-right-radius: 0;
    }

    .bot {
      align-self: flex-start;
      background-color: #f1f0f0;
      border-bottom-left-radius: 0;
    }

    #chat-input {
      display: flex;
      padding: 10px;
      background: #ffffff;
      border-top: 1px solid #ccc;
    }

    #user-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid #ccc;
      font-size: 15px;
      outline: none;
    }

    #chat-input button {
      margin-left: 8px;
      background-color: #00b496;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }

    #chat-input button:hover {
      background-color: #007e77;
    }

    #map {
      display: none;
      height: 300px;
      width: 100%;
      z-index: 1;
    }

    #toggle-map-btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      margin: 10px auto;
      display: block;
      font-size: 14px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      #chat-header {
        font-size: 18px;
      }
      #chat-input button {
        padding: 8px 10px;
        font-size: 12px;
      }
    }
    .card {
    display: none;
    background-color: #fff;
    border: 1px solid #ccc;
    padding: 15px;
    margin: 10px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  #complaint-text {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #aaa;
    font-size: 15px;
  }
  /* 🔧 Centered and full-screen modal overlay */
  .modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.5);

  display: none;
  justify-content: center;
  align-items: center;
}


  /* 📦 Modal content box */
  .modal-content {
    background-color: white;
    width: 90%;
    max-width: 400px;
    padding: 20px;
    border-radius: 10px;
    position: relative;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  }

  /* ❌ Close button */
  .close {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 24px;
    color: #333;
    cursor: pointer;
  }
  .modal {
  transition: opacity 0.3s ease-in-out;
}

 #suggestions {
  display: flex;
  gap: 8px;
  padding: 8px;
  justify-content: center;
}

#suggestions button {
  padding: 6px 12px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-size: 14px;
}

#suggestions button:hover {
  background: #0056b3;
}


  </style>
</head>
<body>
<div id="chat-header">
  <span>🚖 CHATBOT</span><small>👋 Welcome, {{ username }}!</small>
  <div class="menu-container">
    <button class="menu-btn" onclick="toggleMenu()">⋮</button>
    <div class="dropdown" id="menu-dropdown">
      <a href="#" onclick="clearChat()">🧹 Clear Chat</a>
      <a href="/profile">👤 Profile</a>
      <a href="/logout">🚪 Logout</a>
    </div>
  </div>
</div>


    <div id="chat-box">
      {% for chat in chats %}
        <div class="message {{ chat['sender'] }}">{{ chat['message'] }}</div>
      {% endfor %}
    </div>

    <button id="toggle-map-btn" onclick="toggleMap()">📍 Show Map</button>
    <div id="map"></div>

    <div id="suggestions">
  <button onclick="sendSuggestion('Book a ride')">Book a ride</button>
  <button onclick="sendSuggestion('What is Ride ID?')">What is Ride ID?</button>
  <button onclick="sendSuggestion('What is Pickup Location?')">What is Pickup Location?</button>
</div>

    <div id="chat-input">
      <input type="text" id="user-input" placeholder="Type or speak..." />
      <button onclick="sendMessage()">Send</button>
      <button onclick="startListening()">🎤</button>
    </div>
  </div>
</div> <!-- end of chat-container -->

  <!-- 🚨 Complaint Modal -->
  <div id="complaint-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('complaint-modal')">&times;</span>
      <h3>🛑 Submit a Complaint</h3>
      <textarea id="complaint-text" rows="4" style="width: 100%;" placeholder="Describe your issue..."></textarea>
     <button onclick="submitComplaint()">Submit</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;

async function sendMessage() {
    const input = document.getElementById("user-input");
    const msg = input.value.trim();
    if (!msg) return;

    // ✅ Hide suggestions after first user message
    const suggestionsDiv = document.getElementById("suggestions");
    if (suggestionsDiv) {
        suggestionsDiv.style.display = "none";
    }

    const chat = document.getElementById("chat-box");
    chat.innerHTML += `<div class="message user">${msg}</div>`;
    input.value = "";

    const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
    });

    const data = await res.json();
    const botReply = data.response;

    chat.innerHTML += `<div class="message bot">${botReply}</div>`;
    chat.scrollTop = chat.scrollHeight;
    speak(botReply);

    // ✅ Complaint modal trigger
    if (data.trigger && data.trigger === "open_complaint") {
        openModal("complaint-modal");
    }

    // ✅ Map display on ride confirmation
    if (botReply.includes("✅ Ride confirmed!")) {
        const fromMatch = botReply.match(/From: (.*)/i);
        const toMatch = botReply.match(/To: (.*)/i);
        if (fromMatch && toMatch) {
            const pickup = fromMatch[1].trim().split("\n")[0];
            const drop = toMatch[1].trim().split("\n")[0];
            showMap(pickup, drop);
        }
    }
}





    function startListening() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = "en-IN";
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById("user-input").value = transcript;
        sendMessage();
      };

      recognition.onerror = (event) => {
        alert("Voice recognition error: " + event.error);
      };

      recognition.start();
    }

    function speak(text) {
      const cleanText = text.replace(/[\u{1F300}-\u{1F6FF}]/gu, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = "en-IN";
      utterance.rate = 1;
      speechSynthesis.speak(utterance);
    }

    function toggleMap() {
      const mapDiv = document.getElementById("map");
      const btn = document.getElementById("toggle-map-btn");

      if (mapDiv.style.display === "none") {
        mapDiv.style.display = "block";
        btn.textContent = "📍 Hide Map";
      } else {
        mapDiv.style.display = "none";
        btn.textContent = "📍 Show Map";
      }
    }

    function showMap(pickup, drop) {
      if (map) map.remove();

      fetch(`/route?pickup=${pickup}&drop=${drop}`)
        .then(res => res.json())
        .then(data => {
          const { pickup_coords, drop_coords, route_coords } = data;

          map = L.map("map").setView([pickup_coords[0], pickup_coords[1]], 13);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(map);

          const carIcon = L.icon({
            iconUrl: "/static/images/car-icon.png",
            iconSize: [40, 40],
            iconAnchor: [20, 20]
          });

          L.marker([pickup_coords[0], pickup_coords[1]]).addTo(map).bindPopup("Pickup").openPopup();
          L.marker([drop_coords[0], drop_coords[1]]).addTo(map).bindPopup("Drop");

          const routeLatLngs = route_coords.map(coord => [coord[0], coord[1]]);
          L.polyline(routeLatLngs, { color: "blue" }).addTo(map);

          let index = 0;
          const movingMarker = L.marker(routeLatLngs[0], { icon: carIcon }).addTo(map);
          function animate() {
            if (index < routeLatLngs.length) {
              movingMarker.setLatLng(routeLatLngs[index]);
              index++;
              setTimeout(animate, 1500);
            }
          }
          animate();
        });
    }


    function openModal(id) {
  const modal = document.getElementById(id);
  if (modal) {
    modal.style.display = 'flex';  // or 'block' depending on your layout
    const textarea = modal.querySelector("textarea");
    if (textarea) textarea.focus();  // Autofocus only when opened
  }
}

function closeModal(id) {
  const modal = document.getElementById(id);
  if (modal) {
    modal.style.display = "none";

    // Clear textarea when closing
    const textarea = modal.querySelector("textarea");
    if (textarea) textarea.value = "";
  }
}




  function submitComplaint() {
    const text = document.getElementById("complaint-text").value.trim();
    if (!text) {
      alert("Please enter your complaint.");
      return;
    }

    fetch('/complaint', {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      closeModal("complaint-modal");
      document.getElementById("complaint-text").value = "";
    });
  }
  
  window.onclick = function(event) {
    const modal = document.getElementById("complaint-modal");
    if (event.target === modal) {
      modal.style.display = "none";
    }
  };
function toggleMenu() {
  const menu = document.getElementById("menu-dropdown");
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

// Hide menu if user clicks outside
window.addEventListener("click", function(event) {
  const menu = document.getElementById("menu-dropdown");
  if (!event.target.matches('.menu-btn')) {
    if (menu.style.display === "block") {
      menu.style.display = "none";
    }
  }
});

// 🧹 Clear Chat via API
function clearChat() {
  fetch('/clear_chat', {
    method: 'POST'
  })
  .then(res => res.json())
  .then(data => {
    alert(data.message);
    location.reload();
  });
}
function sendSuggestion(text) {
  document.getElementById("user-input").value = text;
  sendMessage();
}


  </script>
</body>
</html>
