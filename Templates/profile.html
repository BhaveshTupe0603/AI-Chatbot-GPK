<!DOCTYPE html>
<html>
<head>
  <title>SmartBot - Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .profile-box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 400px;
    }
    

    h2 {
      text-align: center;
      color: #007bff;
    }

    label {
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin: 8px 0 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="profile-box">
    <h2>👤 My Profile</h2>
    <form method="post">
      <label>Username:</label>
      <input type="text" value="{{ user['username'] }}" disabled />

      <label>Email:</label>
      <input type="text" name="email" value="{{ user['email'] or '' }}" />

      <label>Phone:</label>
      <input type="text" name="phone" value="{{ user['phone'] or '' }}" />

      <button type="submit">💾 Update Profile</button>
    </form>
    <br>
    <a href="/">⬅️ Back to Chat</a>
    {% if rides %}
  <hr>
  <h3>🚘 Your Previous Rides</h3>
  <ul>
    {% for ride in rides %}
      <li>
        <strong>{{ ride.ride_type }}</strong> | {{ ride.pickup }} → {{ ride.drop_location }}<br>
        ₹{{ ride.fare }} | {{ ride.timestamp }} | Ride ID: <code>{{ ride.ride_id }}</code>
      </li>
    {% endfor %}
  </ul>
{% endif %}

  </div>
</body>
</html>
