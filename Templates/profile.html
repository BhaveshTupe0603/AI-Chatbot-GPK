<!DOCTYPE html>
<html>
<head>
  <title>SmartBot - Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      margin: 0;
    }

    .profile-box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      text-align: center;
      color: #007bff;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      margin-top: 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #007bff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    hr {
      margin: 30px 0 10px;
    }

    h3 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #333;
    }

    ul {
      list-style: none;
      padding-left: 0;
      font-size: 14px;
      line-height: 1.6;
    }

    li {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #ddd;
    }

    code {
      background: #f1f1f1;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .profile-box {
        padding: 20px;
      }

      h2 {
        font-size: 22px;
      }

      input, button {
        font-size: 15px;
      }

      h3 {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="profile-box">
    <h2>👤 My Profile</h2>
    <form method="post">
      <label>Username:</label>
      <input type="text" value="{{ user['username'] }}" disabled />

      <label>Email:</label>
      <input type="text" name="email" value="{{ user['email'] or '' }}" />

      <label>Phone:</label>
      <input type="text" name="phone" value="{{ user['phone'] or '' }}" />

      <button type="submit">💾 Update Profile</button>
    </form>

  <a href="{{ url_for('index') }}">🔙 Back to Chat</a>


    {% if rides %}
      <hr>
      <h3>🚘 Your Previous Rides</h3>
      <ul>
        {% for ride in rides %}
          <li>
            <strong>{{ ride.ride_type.title() }}</strong> | {{ ride.pickup }} → {{ ride.drop_location }}<br>
            ₹{{ ride.fare }} | {{ ride.timestamp }}<br>
            <span>🆔 Ride ID: <code>{{ ride.ride_id }}</code></span>
          </li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
</body>
</html>
